{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه قالب | مرجع تخصصی قالب‌های وبسایت</title>
    <meta name="description" content="دسترسی به بهترین قالب‌های سایت‌های خارجی برای کاربران ایرانی">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static "css/base.css" %}">
    <link rel="stylesheet" href="{% static "css/components.css" %}">
    <link rel="stylesheet" href="{% static "css/dashboard.css" %}">
    <link rel="stylesheet" href="{% static "css/landing.css" %}">
    <link rel="stylesheet" href="{% static "css/layouts.css" %}">
    <link rel="stylesheet" href="{% static "css/responsive.css" %}">
    <link rel="stylesheet" href="{% static "css/utilities.css" %}">

    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="landing-page">
    <!-- Main Content -->
    <main class="main">
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="hero-background">
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                    <div class="shape shape-4"></div>
                </div>
            </div>

            <div class="container">
                <div class="hero-content">

                    <!-- Platforms Grid -->
                    <div class="platforms-grid">
                        <!-- Shopify -->
                        <a href="/templates/" class="platform-card active-platform">
                            <div class="platform-logo">
                                <i class="fab fa-shopify"></i>
                            </div>
                            <h3 class="platform-name">Shopify</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- SquareSpace -->
                        <a href="#" class="platform-card coming-soon">
                            <div class="platform-logo">
                                <i class="fas fa-square"></i>
                            </div>
                            <h3 class="platform-name">SquareSpace</h3>
                            <div class="platform-cta">
                                <span>به زودی</span>
                                <i class="fas fa-clock"></i>
                            </div>
                        </a>

                        <!-- Coming Soon Platform -->
                        <a href="#" class="platform-card coming-soon">
                            <div class="platform-logo">
                                <i class="fas fa-rocket"></i>
                            </div>
                            <h3 class="platform-name">پلتفرم جدید</h3>
                            <div class="platform-cta">
                                <span>به زودی</span>
                                <i class="fas fa-clock"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="{% static "js/landing.js" %}"></script>
</body>
</html>
