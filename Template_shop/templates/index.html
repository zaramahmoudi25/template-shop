{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران اد پی - مرجع تخصصی قالب‌های وبسایت</title>
    <meta name="description" content="دسترسی به بهترین قالب‌های سایت‌های خارجی برای کاربران ایرانی">

    <link rel="stylesheet" href="{% static "css/base.css" %}">
    <link rel="stylesheet" href="{% static "css/landing.css" %}">
    <link rel="stylesheet" href="{% static "css/components.css" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

 <header class="header">
    <div class="container">
        <div class="header__inner">
            <div class="header__logo">
                <a href="/index/" class="logo-link">
                    <!-- <img src="/Images and SVGs/logo.png" alt="ایران اد پی" class="logo"> -->
                    <span class="logo-text">ایران اد پی</span>
                </a>
            </div>

            <nav class="header__nav" id="mainNav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="/index/" class="nav-link">خانه</a>
                    </li>


                    <li class="nav-item">
                        <a href="/services/" class="nav-link">خدمات ما</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about/" class="nav-link">درباره ما</a>
                    </li>

                    <li class="nav-item">
                        <a href="/contact/" class="nav-link">تماس با ما</a>
                    </li>
                </ul>
            </nav>

            <div class="header__actions">
                <div class="auth-buttons">
                    {% if user.is_authenticated %}
                        <a href="/dashboard/" class="btn btn-primary">پنل کاربری</a>
                        <a href="/logout/" class="btn btn-outline">خروج</a>
                    {% else %}
                        <a href="/login/" class="btn btn-outline">ورود</a>
                        <a href="/signup/" class="btn btn-primary">ثبت‌نام</a>
                    {% endif %}
                </div>



                    <!-- <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button> -->
            </div>
        </div>
    </div>
</header>
    <!-- Main Content -->
    <main class="main">
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="hero-background">
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                    <div class="shape shape-4"></div>
                </div>
            </div>

            <div class="container">
                <div class="hero-content">
                    <!-- Platforms Grid -->
                    <div class="platforms-grid">
                        <!-- Shopify -->
                        <a href="/templates/" class="platform-card active-platform">
                            <div class="platform-logo">
                                <i class="fab fa-shopify"></i>
                            </div>
                            <h3 class="platform-name">Shopify</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- YouTube & Adsense -->
                        <a href="/youtube-adsense/" class="platform-card">
                            <div class="platform-logo">
                                <i class="fab fa-youtube"></i>
                            </div>
                            <h3 class="platform-name">نقد درآمد یوتیوب و وب سایت</h3>
                            <div class="platform-cta">
                                <span>مشاهده تحلیل‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>


                        <!-- Coming Soon Platform -->
                        <a href="#" class="platform-card coming-soon">
                            <div class="platform-logo">
                                <i class="fas fa-rocket"></i>
                            </div>
                            <h3 class="platform-name">پلتفرم جدید</h3>
                            <div class="platform-cta">
                                <span>به زودی</span>
                                <i class="fas fa-clock"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="{% static "js/landing.js" %}">

    </script>
</body>
</html>
