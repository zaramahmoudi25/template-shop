<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قالب‌شاپ - مرجع تخصصی قالب‌های وبسایت</title>
    <meta name="description" content="دسترسی به بهترین قالب‌های سایت‌های خارجی برای کاربران ایرانی">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="/CSS/base.css">
    <link rel="stylesheet" href="/CSS/landing.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="landing-page">
    <!-- Main Content -->
    <main class="main">
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="hero-background">
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                    <div class="shape shape-4"></div>
                </div>
            </div>

            <div class="container">
                <div class="hero-content">
                    <!-- Animated Logo -->
                    <div class="main-logo">
                        <div class="logo-circle">
                            <i class="fas fa-palette logo-icon"></i>
                        </div>
                        <h1 class="logo-text">قالب‌شاپ</h1>
                    </div>

                    <!-- Title -->
                    <h2 class="hero-title">
                        بهترین قالب‌های وبسایت در یک مکان
                    </h2>

                    <!-- Platforms Grid -->
                    <div class="platforms-grid">
                        <!-- Shopify -->
                        <a href="/Pages/template-detail.html?platform=shopify" class="platform-card">
                            <div class="platform-logo">
                                <i class="fab fa-shopify"></i>
                            </div>
                            <h3 class="platform-name">Shopify</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- WordPress -->
                        <a href="/Pages/template-detail.html?platform=wordpress" class="platform-card">
                            <div class="platform-logo">
                                <i class="fab fa-wordpress"></i>
                            </div>
                            <h3 class="platform-name">WordPress</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- Wix -->
                        <a href="/Pages/template-detail.html?platform=wix" class="platform-card">
                            <div class="platform-logo">
                                <i class="fas fa-paint-brush"></i>
                            </div>
                            <h3 class="platform-name">Wix</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="/JS/landing.js"></script>
</body>
</html>
