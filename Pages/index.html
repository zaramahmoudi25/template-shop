<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قالب‌شاپ - مرجع تخصصی قالب‌های وبسایت</title>
    <meta name="description" content="دسترسی به بهترین قالب‌های سایت‌های خارجی برای کاربران ایرانی">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="/CSS/base.css">
    <link rel="stylesheet" href="/CSS/landing.css">
    <link rel="stylesheet" href="/CSS/components.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="landing-page">
       <header class="header">
    <div class="container">
        <div class="header__inner">
            <div class="header__logo">
                <a href="/Pages/index.html" class="logo-link">
                    <img src="/Images and SVGs/logo.png" alt="قالب‌شاپ" class="logo">
                    <span class="logo-text">قالب‌شاپ</span>
                </a>
            </div>

            <nav class="header__nav" id="mainNav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="/Pages/index.html" class="nav-link">خانه</a>
                    </li>
                   
                   
                    <li class="nav-item">
                        <a href="/Pages/services.html" class="nav-link">خدمات ما</a>
                    </li>
                    <li class="nav-item">
                        <a href="/Pages/about.html" class="nav-link">درباره ما</a>
                    </li>
                      <li class="nav-item">
                        <a href="/Pages/feedback.html" class="nav-link">پیشنهادات و انتقادات</a>
                    </li>
                    <li class="nav-item">
                        <a href="/Pages/contact.html" class="nav-link">تماس با ما</a>
                    </li>
                </ul>
            </nav>

            <div class="header__actions">
                <div class="auth-buttons">
                    <a href="/Pages/login.html" class="btn btn-outline">ورود</a>
                    <a href="/Pages/signup.html" class="btn btn-primary">ثبت‌نام</a>
                </div>

                
             
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
            </div>
        </div>
    </div>
</header>
    <!-- Main Content -->
    <main class="main">
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="hero-background">
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                    <div class="shape shape-4"></div>
                </div>
            </div>

            <div class="container">
                <div class="hero-content">
                    <!-- Platforms Grid -->
                    <div class="platforms-grid">
                        <!-- Shopify -->
                        <a href="/Pages/templates.html" class="platform-card active-platform">
                            <div class="platform-logo">
                                <i class="fab fa-shopify"></i>
                            </div>
                            <h3 class="platform-name">Shopify</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- YouTube & Adsense -->
                        <a href="/Pages/youtube-adsense.html" class="platform-card">
                            <div class="platform-logo">
                                <i class="fab fa-youtube"></i>
                            </div>
                            <h3 class="platform-name">نقد درآمد یوتیوب و وب سایت</h3>
                            <div class="platform-cta">
                                <span>مشاهده تحلیل‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>


                        <!-- Coming Soon Platform -->
                        <a href="#" class="platform-card coming-soon">
                            <div class="platform-logo">
                                <i class="fas fa-rocket"></i>
                            </div>
                            <h3 class="platform-name">پلتفرم جدید</h3>
                            <div class="platform-cta">
                                <span>به زودی</span>
                                <i class="fas fa-clock"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="/JS/landing.js">
        
        // Mobile menu functionality
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mainNav = document.getElementById('mainNav');

        if (mobileMenuBtn && mainNav) {
            mobileMenuBtn.addEventListener('click', function() {
                const isOpen = mainNav.classList.contains('active');
                
                if (isOpen) {
                    mainNav.classList.remove('active');
                    mobileMenuBtn.classList.remove('active');
                    document.body.classList.remove('menu-open');
                } else {
                    mainNav.classList.add('active');
                    mobileMenuBtn.classList.add('active');
                    document.body.classList.add('menu-open');
                }
            });
        }
        // Close menu when clicking on links
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('active');
                mobileMenuBtn.classList.remove('active');
                body.classList.remove('menu-open');
            });
        });
    </script>
</body>
</html>
