<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران اد پی - مرجع تخصصی قالب‌های وبسایت</title>
    <meta name="description" content="دسترسی به بهترین قالب‌های سایت‌های خارجی برای کاربران ایرانی">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="/CSS/base.css">
    <link rel="stylesheet" href="/CSS/landing.css">
    <link rel="stylesheet" href="/CSS/components.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body class="landing-page">
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__logo">
                    <a href="/Pages/index.html" class="logo-link">
                        <span class="logo-text">ایران اد پی</span>
                    </a>
                </div>

                <nav class="header__nav" id="mainNav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="/Pages/index.html" class="nav-link">خانه</a>
                        </li>
                      
                        <li class="nav-item">
                            <a href="/Pages/services.html" class="nav-link">خدمات ما</a>
                        </li>
                        <li class="nav-item">
                            <a href="/Pages/about.html" class="nav-link">درباره ما</a>
                        </li>
                        <li class="nav-item">
                            <a href="/Pages/contact.html" class="nav-link">تماس با ما</a>
                        </li>
                    </ul>
                </nav>

                <div class="header__actions">
                    <div class="auth-buttons">
                        <a href="/Pages/login.html" class="btn btn-outline">ورود</a>
                        <a href="/Pages/signup.html" class="btn btn-primary">ثبت‌نام</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="hero-background">
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                    <div class="shape shape-4"></div>
                </div>
            </div>

            <div class="container">
                <div class="hero-content">
                    <!-- Platforms Grid -->
                    <div class="platforms-grid">
                        <!-- قالب‌های وبسایت -->
                        <a href="/Pages/templates.html" class="platform-card active-platform">
                            <div class="platform-logo">
                                <i class="fas fa-palette"></i>
                            </div>
                            <h3 class="platform-name">قالب‌های وبسایت</h3>
                            <div class="platform-cta">
                                <span>مشاهده قالب‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- نقد درآمد یوتیوب -->
                        <a href="#" class="platform-card" id="youtubeCard">
                            <div class="platform-logo">
                                <i class="fab fa-youtube"></i>
                            </div>
                            <h3 class="platform-name">نقد درآمد یوتیوب</h3>
                            <div class="platform-cta">
                                <span>مشاهده تحلیل‌ها</span>
                                <i class="fas fa-arrow-left"></i>
                            </div>
                        </a>

                        <!-- پلتفرم جدید -->
                        <a href="#" class="platform-card coming-soon">
                            <div class="platform-logo">
                                <i class="fas fa-rocket"></i>
                            </div>
                            <h3 class="platform-name">پلتفرم جدید</h3>
                            <div class="platform-cta">
                                <span>به زودی</span>
                                <i class="fas fa-clock"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Infinite Logo Slider -->
            <div class="infinite-slider-container">
                <div class="infinite-slider">
                    <div class="slider-track">
                        <!-- لوگوها - دو بار تکرار برای infinite effect -->
                        <div class="logo-item">
                            <i class="fab fa-shopify"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-google"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-youtube"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-wordpress"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-shopify"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-google"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-youtube"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-wordpress"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/JS/landing.js"></script>
</body>
</html>
