<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران اد پی - مرجع تخصصی قالب‌های وبسایت</title>
    <meta name="description" content="دسترسی به بهترین قالب‌های سایت‌های خارجی برای کاربران ایرانی">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="/CSS/base.css">
    <link rel="stylesheet" href="/CSS/landing.css">
    <link rel="stylesheet" href="/CSS/components.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body class="landing-page">
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__logo">
                    <a href="/Pages/index.html" class="logo-link">
                        <span class="logo-text">ایران اد پی</span>
                    </a>
                </div>

                <nav class="header__nav" id="mainNav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="/Pages/index.html" class="nav-link">خانه</a>
                        </li>
                      
                        <li class="nav-item">
                            <a href="/Pages/services.html" class="nav-link">خدمات ما</a>
                        </li>
                        <li class="nav-item">
                            <a href="/Pages/about.html" class="nav-link">درباره ما</a>
                        </li>
                        <li class="nav-item">
                            <a href="/Pages/contact.html" class="nav-link">تماس با ما</a>
                        </li>
                    </ul>
                </nav>

                <div class="header__actions">
                    <div class="auth-buttons">
                        <a href="/Pages/login.html" class="btn btn-outline">ورود</a>
                        <a href="/Pages/signup.html" class="btn btn-primary">ثبت‌نام</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="hero-background">
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                    <div class="shape shape-4"></div>
                </div>
            </div>
<div class="container">
    <div class="hero-content">
        <div class="hero-wrapper">
           



             <!-- Text & Button Section (Right) -->
            <div class="hero-text-section">
                <h1 class="hero-main-title">
                    <span class="title-gradient">ایران ادپی</span>
                </h1>
                <p class="hero-subtitle">
                    دسترسی به بهترین قالب‌های سایت‌های خارجی
                </p>
                  <div class="hero-features">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="fas fa-language"></i>
                        </div>
                        <div class="feature-content">
                            <h4>ترجمه فارسی</h4>
                        </div>
                    </div>
                    
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div class="feature-content">
                            <h4>پشتیبانی ۲۴/۷</h4>
                        </div>
                    </div>
                    
                    <div class="feature-item">
                        <div class="feature-icon">
                            <i class="fas fa-bolt"></i>
                        </div>
                        <div class="feature-content">
                            <h4>نصب سریع</h4>
                        </div>
                    </div>
                </div>
                <div class="hero-actions">
                    <a href="/Pages/services.html" class="btn hero-primary-btn">
                        <i class="fas fa-rocket"></i>
                        ورود به خدمات ما
                    </a>
                    <a href="/Pages/templates.html" class="btn hero-secondary-btn">
                        <i class="fas fa-eye"></i>
                        مشاهده قالب‌ها
                    </a>
                </div>
                
              
            </div>
            
            <!-- Icon Section (Left) -->
            <div class="hero-icon-section">
                <div class="hero-icon-wrapper">
                    <i class="fas fa-palette hero-main-icon"></i>
                    <div class="icon-glow"></div>
                </div>
            </div>
        </div>
    </div>
</div>

            <!-- Infinite Logo Slider -->
            <div class="infinite-slider-container">
                <div class="infinite-slider">
                    <div class="slider-track">
                        <!-- لوگوها - دو بار تکرار برای infinite effect -->
                        <div class="logo-item">
                            <i class="fab fa-shopify"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-google"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-youtube"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-wordpress"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-shopify"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-google"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-youtube"></i>
                        </div>
                        <div class="logo-item">
                            <i class="fab fa-wordpress"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/JS/landing.js"></script>
